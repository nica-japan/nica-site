name: サイトを公開

# main に変更が入るたびに HTML を書き出して公開する。
# 構造の検査（check.py）に通らなければ公開しない。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 新しい画像を最適化する（WebP 作成・位置情報の削除）
        run: |
          pip install --quiet pillow
          python3 optimize_images.py

      - name: HTML を書き出す
        run: python3 build.py

      - name: 構造を検査する
        run: python3 check.py

      - name: 公開するファイルだけを集める
        run: |
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude '.claude' --exclude '_site' \
            --exclude '*.py' --exclude '__pycache__' \
            --exclude 'data' --exclude 'tools' --exclude 'README.md' --exclude 'source-snapshot.json'

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
